<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gesture 3D Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1c;color:#eef3ff;font-family:system-ui,Arial;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;z-index:2;left:12px;right:12px;top:12px;padding:14px 15px;border:1px solid #34415f;background:#101a30eF;border-radius:18px;backdrop-filter:blur(12px)}
h1{font-size:19px;margin:0 0 4px}.sub{font-size:12px;color:#b7c4df}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:11px 14px;background:#7c5cff;color:white;font-weight:700;font-size:14px}
button.secondary{background:#273653}
#status{font-size:12px;color:#a9f0ca;margin-left:auto}
#cam{position:fixed;right:12px;bottom:12px;width:112px;height:148px;object-fit:cover;border-radius:14px;border:1px solid #647399;transform:scaleX(-1);display:none}
#guide{position:fixed;bottom:18px;left:12px;right:140px;font-size:12px;line-height:1.5;color:#d8e1f5;background:#101a30d9;border:1px solid #34415f;border-radius:14px;padding:10px}
#hand{color:#ffd98a}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="panel">
  <h1>✋ Gesture 3D Lab</h1>
  <div class="sub">Control a 3D object with your hand camera</div>
  <div class="row">
    <button id="start">Start camera</button>
    <button class="secondary" id="reset">Reset object</button>
    <span id="status">Touch mode ready</span>
  </div>
</div>
<video id="cam" playsinline muted></video>
<div id="guide"><b>Try these gestures</b><br>• Move your index finger: rotate the object<br>• Pinch thumb + index: resize it<br>• Open palm: change its colour<br><span id="hand">Camera starts only after you tap Start camera.</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.z=5;
scene.add(new THREE.AmbientLight(0xffffff,.8));
const light=new THREE.DirectionalLight(0xffffff,1.2);light.position.set(2,3,4);scene.add(light);
const geometry=new THREE.IcosahedronGeometry(1.15,1);
const material=new THREE.MeshStandardMaterial({color:0x7c5cff,metalness:.35,roughness:.25,flatShading:true});
const object=new THREE.Mesh(geometry,material);scene.add(object);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.65,.018,8,100),new THREE.MeshBasicMaterial({color:0x47d7e8}));
ring.rotation.x=1.15;scene.add(ring);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let targetX=0,targetY=0,targetScale=1,handActive=false,colourIndex=0;
function animate(){requestAnimationFrame(animate);object.rotation.x+=(targetX-object.rotation.x)*.12;object.rotation.y+=(targetY-object.rotation.y)*.12;object.scale.setScalar(targetScale);ring.rotation.z+=.003;renderer.render(scene,camera)}
animate();
document.getElementById('reset').onclick=()=>{targetX=0;targetY=0;targetScale=1;object.material.color.setHex(0x7c5cff);document.getElementById('status').textContent='Object reset'};
const video=document.getElementById('cam'),status=document.getElementById('status'),handText=document.getElementById('hand');
let cameraFeed=null;
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function onResults(results){
  if(results.multiHandLandmarks&&results.multiHandLandmarks.length){
    const lm=results.multiHandLandmarks[0],tip=lm[8],thumb=lm[4];
    handActive=true;video.style.display='block';
    targetY=(tip.x-.5)*5;targetX=(tip.y-.5)*-4;
    const pinch=distance(tip,thumb);
    targetScale=Math.max(.55,Math.min(1.8,.55+pinch*3.4));
    const fingers=[8,12,16,20].filter(i=>lm[i].y<lm[i-2].y).length;
    if(fingers>=4){colourIndex=(colourIndex+1)%3;const colours=[0x35d6c8,0xffa94d,0xd879ff];object.material.color.setHex(colours[colourIndex]);}
    status.textContent='Hand detected ✓';
    handText.textContent='Great! Move your index finger and pinch to control the 3D shape.';
  }else{
    handActive=false;status.textContent='Show your hand to camera';
    handText.textContent='Keep one hand visible in the camera preview.';
  }
}
document.getElementById('start').onclick=async()=>{
  const btn=document.getElementById('start');btn.disabled=true;btn.textContent='Starting…';
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera needs an HTTPS website. Open this page using GitHub Pages or another secure website.');
    video.style.display='block';
    const hands=new Hands({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});
    hands.onResults(onResults);
    cameraFeed=new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:640,height:480});
    await cameraFeed.start();
    status.textContent='Camera on — show your hand';
    btn.textContent='Camera running';
  }catch(e){
    status.textContent='Could not start camera';
    handText.textContent=e.message+' Check camera permission and internet, then reload.';
    btn.disabled=false;btn.textContent='Try camera again';
  }
};
// Touch fallback: drag to rotate, two-finger pinch to resize.
let last=null;
canvas.addEventListener('pointerdown',e=>{last={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!last)return;targetY+=(e.clientX-last.x)*.012;targetX+=(e.clientY-last.y)*.012;last={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointerup',()=>last=null);
</script>
</body>
</html>
